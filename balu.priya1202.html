<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Wedding Anniversary</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: url('https://wallpapercave.com/lovable-wallpapers-desktop') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    h1 {
      font-size: 4rem;
      margin: 20px 0;
      animation: fadeIn 3s ease;
    }
    .cake {
      width: 200px;
      height: 200px;
      background: url('https://in.pinterest.com/pin/5418462039259036/') no-repeat center;
      background-size: cover;
      animation: bounce 2s infinite;
    }
    .heart {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: pink;
      transform: rotate(-45deg);
      animation: floatUp 5s infinite;
    }
    .heart:before,
    .heart:after {
      content: '';
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: pink;
      border-radius: 50%;
    }
    .heart:before {
      top: -25px;
      left: 0;
    }
    .heart:after {
      top: 0;
      left: 25px;
    }
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-500px) scale(1.5);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .fireworks {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('https://gifs.alphacoders.com/gifs/view/84381') no-repeat center;
      background-size: cover;
      animation: fadeIn 3s;
    }
  </style>
</head>
<body>
  <div class="fireworks"></div>
  <div class="container">
    <h1>Wishing You a Happy Wedding Anniversary, Chithapa & Chithi!</h1>
    <div class="cake"></div>
  </div>
  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
